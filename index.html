<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cherish English Academy — Vocabulary Builder: Verbs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e11;
  --bg2:#16161b;
  --bg3:#1e1e25;
  --bg4:#26262f;
  --border:#2e2e38;
  --border2:#3a3a48;
  --text:#e8e8f0;
  --text2:#9090a8;
  --text3:#5a5a72;
  --accent:#7c6af7;
  --accent2:#5b4de0;
  --accent-dim:#2a2452;
  --green:#2ecc8a;
  --green-dim:#0d3d28;
  --red:#e05a5a;
  --red-dim:#3d1515;
  --gold:#f0c060;
  --gold-dim:#3a2d08;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:740px;margin:0 auto;padding:2rem 1.25rem 5rem}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.brand h1{font-size:24px;font-weight:500;letter-spacing:-0.5px;color:var(--text)}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-bottom:1px}
.sub{font-size:13px;color:var(--text3);margin-bottom:1.75rem;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.75rem}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat-n{font-size:22px;font-weight:500;color:var(--text)}
.stat-n.accent{color:var(--accent)}
.stat-l{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:.4px;text-transform:uppercase}
.progress-log{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:1.25rem}
.plog-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.plog-title{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.plog-reset{background:none;border:1px solid var(--border);color:var(--text3);font-size:11px;padding:3px 11px;border-radius:20px;cursor:pointer;transition:all .15s;letter-spacing:.3px}
.plog-reset:hover{color:var(--text);border-color:var(--border2)}
.plog-row{margin-bottom:11px}
.plog-row:last-child{margin-bottom:0}
.plog-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:8px}
.plog-name{color:var(--text2)}
.plog-count{color:var(--text3);white-space:nowrap}
.plog-bar{height:6px;background:var(--bg4);border-radius:4px;overflow:hidden}
.plog-fill{height:100%;border-radius:4px;transition:width .4s ease}
.level-tabs{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.lvl-tab{padding:7px 16px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;font-weight:500}
.lvl-tab:hover{border-color:var(--border2);color:var(--text)}
.lvl-tab.lv0.active{background:var(--accent-dim);border-color:var(--accent);color:#c4bcff}
.lvl-tab.lv1.active{background:#0d2a3d;border-color:#378add;color:#85c4f4}
.lvl-tab.lv2.active{background:#0a2d1e;border-color:#1d9e75;color:#5dcaa5}
.lvl-tab.lv3.active{background:#2d1508;border-color:#d85a30;color:#f09970}
.level-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.lb0{background:var(--accent-dim);color:#c4bcff;border:1px solid var(--accent)}
.lb1{background:#0d2a3d;color:#85c4f4;border:1px solid #378add}
.lb2{background:#0a2d1e;color:#5dcaa5;border:1px solid #1d9e75}
.lb3{background:#2d1508;color:#f09970;border:1px solid #d85a30}
.search-row{margin-bottom:1.25rem}
.search-row input{width:100%;padding:11px 16px;font-size:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);outline:none;transition:border-color .15s}
.search-row input:focus{border-color:var(--accent)}
.search-row input::placeholder{color:var(--text3)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:2rem}
.unit-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s}
.unit-card:hover{border-color:var(--border2);background:var(--bg3)}
.unit-card.done{border-color:var(--green);background:#0a1f15}
.unit-title{font-size:13px;font-weight:500;margin-bottom:6px}
.unit-words{font-size:11px;color:var(--text3);line-height:1.6;margin-bottom:10px}
.unit-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.unit-badge.mastered{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
.unit-badge.inprog{background:#0d2a3d;color:#85c4f4;border:1px solid #378add}
.unit-badge.todo{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.btn{display:inline-block;padding:9px 18px;font-size:13px;border:1px solid var(--border2);border-radius:9px;background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500;letter-spacing:.2px}
.btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2)}
.back{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:0 0 1.25rem;display:flex;align-items:center;gap:6px;letter-spacing:.2px;transition:color .15s}
.back:hover{color:var(--text)}
.screen{display:none}.screen.active{display:block}
.mode-tabs{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.mode-tab{padding:7px 14px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:transparent;color:var(--text3);transition:all .15s;font-weight:500}
.mode-tab:hover{color:var(--text);border-color:var(--border2)}
.mode-tab.active{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.def-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.word-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:14px;font-weight:500;margin-bottom:10px;letter-spacing:.3px}
.meaning{font-size:14px;color:var(--text2);margin-bottom:8px;line-height:1.6}
.example{font-size:13px;color:var(--text3);font-style:italic;border-left:2px solid var(--border2);padding-left:12px;margin-bottom:8px;line-height:1.6}
.note{font-size:11px;color:var(--accent);background:var(--accent-dim);border-radius:20px;padding:3px 10px;display:inline-block;letter-spacing:.3px}
.speak-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.speak-q{font-size:14px;color:var(--text2);line-height:1.7}
.speak-word{font-weight:500;color:var(--accent)}
.q-progress{display:flex;gap:3px;margin-bottom:1.5rem}
.q-dot{height:3px;flex:1;border-radius:2px;background:var(--bg4)}
.q-dot.correct{background:var(--green)}.q-dot.wrong{background:var(--red)}.q-dot.done{background:var(--border2)}
.q-sentence{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;font-size:15px;font-weight:500;margin-bottom:1.25rem;line-height:1.7;color:var(--text)}
.q-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.q-opt{padding:12px;font-size:14px;font-weight:500;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--bg2);text-align:center;transition:all .15s;color:var(--text2)}
.q-opt:hover:not(:disabled){background:var(--bg3);color:var(--text);border-color:var(--border2)}
.q-opt.correct{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.q-opt.wrong{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.match-col{display:flex;flex-direction:column;gap:6px}
.match-item{padding:10px 12px;font-size:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);cursor:pointer;text-align:center;transition:all .15s;line-height:1.4;color:var(--text2)}
.match-item:hover{border-color:var(--border2);color:var(--text)}
.match-item.selected{border-color:var(--accent);background:var(--accent-dim);color:#c4bcff}
.match-item.matched{border-color:var(--green);background:var(--green-dim);color:var(--green);cursor:default}
.match-item.wrong-flash{border-color:var(--red);background:var(--red-dim);color:var(--red)}
.write-area{width:100%;padding:12px 14px;font-size:14px;border:1px solid var(--border);border-radius:10px;min-height:80px;resize:vertical;font-family:inherit;margin-bottom:10px;background:var(--bg2);color:var(--text);transition:border-color .15s;outline:none}
.write-area:focus{border-color:var(--accent)}
.write-area::placeholder{color:var(--text3)}
.ai-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px}
.ai-label{font-size:10px;color:var(--accent);margin-bottom:8px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.ai-text{font-size:14px;color:var(--text2);line-height:1.7}
.result-box{background:var(--bg2);border-radius:16px;border:1px solid var(--border);padding:2.5rem;text-align:center;margin:2rem 0}
.result-score{font-size:44px;font-weight:500;margin:.5rem 0;color:var(--text)}
.result-msg{font-size:14px;color:var(--text3);margin-bottom:1.5rem;letter-spacing:.2px}
.result-emoji{font-size:48px;margin-bottom:.5rem}
.divider{height:1px;background:var(--border);margin:1.25rem 0}
.section-label{font-size:11px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:.75rem}
.empty{text-align:center;color:var(--text3);padding:2.5rem;font-size:14px}
</style>
</head>

<div class="app">

<div id="screen-home" class="screen active">
  <div class="brand"><div class="dot"></div><h1>Cherish English Academy</h1></div>

  </div>
  <div class="units" id="unit-grid"></div>
</div>

<div id="screen-unit" class="screen">
  <button class="back" onclick="showHome()">← back</button>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
    <h1 style="font-size:22px;font-weight:500;letter-spacing:-.3px" id="unit-title"></h1>
    <span id="unit-level-badge" class="level-badge"></span>
  </div>
  <p class="sub" id="unit-subtitle"></p>
  <div class="mode-tabs">
    <div class="mode-tab active" onclick="switchMode('learn',this)">Learn</div>
    <div class="mode-tab" onclick="switchMode('match',this)">Match</div>
    <div class="mode-tab" onclick="switchMode('fill',this)">Fill in blank</div>
    <div class="mode-tab" onclick="switchMode('write',this)">Write</div>
    <div class="mode-tab" onclick="switchMode('speak',this)">Speaking</div>
  </div>
  <div id="mode-content"></div>
</div>

<div id="screen-result" class="screen">
  <button class="back" onclick="backToUnit()">← back</button>
  <div class="result-box">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn" onclick="retryMode()">Try again</button>
      <button class="btn primary" onclick="backToUnit()">Back to unit</button>
    </div>
  </div>
</div>

</div>

let mastered={},studied={};
const STORE_M="cea_verbs_mastered",STORE_S="cea_verbs_studied";
function loadProgress(){try{mastered=JSON.parse(localStorage.getItem(STORE_M))||{};studied=JSON.parse(localStorage.getItem(STORE_S))||{};}catch(e){mastered={};studied={};}}
function saveProgress(){try{localStorage.setItem(STORE_M,JSON.stringify(mastered));localStorage.setItem(STORE_S,JSON.stringify(studied));}catch(e){}}
function resetProgress(){if(!confirm("Reset all saved progress? This cannot be undone."))return;mastered={};studied={};saveProgress();renderHome();}
let currentUnit=0,currentMode="learn",lastMode="fill";
let matchState={},fillState={},writeState={};
let currentLevel=0;

function setLevel(lv,el){
  currentLevel=lv;
  document.querySelectorAll(".lvl-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  renderHome();
}

function renderHome(){
  const search=document.getElementById("search").value.toLowerCase();
  const units=ALL_UNITS.filter(u=>{
    if(u.level!==currentLevel)return false;
    if(!search)return true;
    return u.title.toLowerCase().includes(search)||u.words.some(w=>w.w.includes(search));
  });
  const grid=document.getElementById("unit-grid");
  grid.innerHTML="";
  if(units.length===0){grid.innerHTML=`<div class="empty" style="grid-column:1/-1">No units found.</div>`;return;}
  const lv=LEVELS[currentLevel];
  units.forEach(u=>{
    const idx=ALL_UNITS.indexOf(u);
    const done=mastered[idx];
    const started=studied[idx];
    const preview=u.words.slice(0,4).map(x=>x.w).join(", ")+"…";
    grid.innerHTML+=`<div class="unit-card${done?" done":""}" onclick="openUnit(${idx})">
      <div class="unit-title" style="color:${lv.color.text}">${u.title}</div>
      <div class="unit-words">${preview}</div>
      <span class="unit-badge${done?" mastered":started?" inprog":" todo"}">${done?"✓ mastered":started?"in progress":"not started"}</span>
    </div>`;
  });
  document.getElementById("stat-mastered").textContent=Object.keys(mastered).length;
  document.getElementById("stat-studied").textContent=Object.keys(studied).length;
  document.getElementById("stat-total").textContent=Object.keys(studied).length*8;
  document.getElementById("stat-total-all").textContent=ALL_UNITS.length*8;
  document.getElementById("home-sub").textContent=`${LEVELS.length} levels · ${ALL_UNITS.length} units · ${ALL_UNITS.length*8} words`;
  renderProgress();
}

function renderProgress(){
  const el=document.getElementById("progress-log");
  if(!el)return;
  let rows="";
  LEVELS.forEach(lv=>{
    const units=ALL_UNITS.filter(u=>u.level===lv.id);
    const total=units.length;
    const done=units.filter(u=>mastered[ALL_UNITS.indexOf(u)]).length;
    const started=units.filter(u=>studied[ALL_UNITS.indexOf(u)]).length;
    const pct=total?Math.round(done/total*100):0;
    const extra=started>done?` · ${started} started`:"";
    rows+=`<div class="plog-row"><div class="plog-head"><span class="plog-name">${lv.name}</span><span class="plog-count">${done}/${total} mastered${extra}</span></div><div class="plog-bar"><div class="plog-fill" style="width:${pct}%;background:${lv.color.border}"></div></div></div>`;
  });
  el.innerHTML=`<div class="plog-title-row"><span class="plog-title">Your progress (saved on this device)</span><button class="plog-reset" onclick="resetProgress()">reset</button></div>${rows}`;
}

function showHome(){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-home").classList.add("active");
  renderHome();
}

function openUnit(idx){
  currentUnit=idx;studied[idx]=true;saveProgress();
  const u=ALL_UNITS[idx];
  const lv=LEVELS[u.level];
  document.getElementById("unit-title").textContent=u.title;
  const badge=document.getElementById("unit-level-badge");
  badge.textContent=lv.short;badge.className=`level-badge ${lv.badgeClass}`;
  document.getElementById("unit-subtitle").textContent=u.words.map(x=>x.w).join(" · ");
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-unit").classList.add("active");
  document.querySelectorAll(".mode-tab").forEach((t,i)=>t.classList.toggle("active",i===0));
  currentMode="learn";renderMode("learn");
}

function switchMode(mode,el){
  document.querySelectorAll(".mode-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");currentMode=mode;renderMode(mode);
}

function switchModeByName(m){
  const idx={learn:0,match:1,fill:2,write:3,speak:4}[m];
  document.querySelectorAll(".mode-tab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  currentMode=m;renderMode(m);
}

function renderMode(mode){
  const u=ALL_UNITS[currentUnit];
  const c=LEVELS[u.level].color;
  const el=document.getElementById("mode-content");
  if(mode==="learn")renderLearn(u,c,el);
  else if(mode==="match")renderMatch(u,c,el);
  else if(mode==="fill")renderFill(u,c,el);
  else if(mode==="write")renderWrite(u,c,el);
  else if(mode==="speak")renderSpeak(u,c,el);
}

function renderLearn(u,c,el){
  el.innerHTML=u.words.map(wd=>`
    <div class="def-card">
      <span class="word-tag" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${wd.w}</span>
      <div class="meaning">${wd.d}</div>
      <div class="example">"${wd.e}"</div>
      <span class="note">${wd.n}</span>
    </div>`).join("")+
  `<button class="btn primary" style="margin-top:.75rem" onclick="switchModeByName('match')">practice → match</button>`;
}

function renderSpeak(u,c,el){
  const qs=SPEAK_QUESTIONS[u.level]?.[u.title];
  if(!qs||!qs.length){
    el.innerHTML=`<div class="empty">No speaking questions available for this unit yet.</div>`;return;
  }
  el.innerHTML=`<p style="font-size:13px;color:var(--text3);margin-bottom:1rem;letter-spacing:.2px">Practice speaking about these questions using the target words.</p>`+
  qs.map((q,i)=>{
    const word=u.words[i]?u.words[i].w:"";
    const highlighted=q.replace(new RegExp(`\\b${word}\\b`,"gi"),m=>`<span class="speak-word">${m}</span>`);
    return `<div class="speak-card"><div class="speak-q">${highlighted}</div></div>`;
  }).join("")+
  `<button class="btn primary" style="margin-top:.75rem" onclick="switchModeByName('write')">practice writing →</button>`;
}

function renderMatch(u,c,el){
  const words=u.words.map(x=>x.w);
  const defs=u.words.map(x=>x.d);
  const shuffledDefs=[...defs].sort(()=>Math.random()-.5);
  matchState={words,defs,shuffledDefs,selected:null,matched:[]};
  el.innerHTML=`<p style="font-size:13px;color:var(--text3);margin-bottom:1rem">Tap a word, then tap its definition to match them.</p>
  <div class="match-grid">
    <div class="match-col" id="match-words">${words.map((w,i)=>`<div class="match-item" id="mw-${i}" onclick="matchClick('word',${i})">${w}</div>`).join("")}</div>
    <div class="match-col" id="match-defs">${shuffledDefs.map((d,i)=>`<div class="match-item" id="md-${i}" onclick="matchClick('def',${i})">${d}</div>`).join("")}</div>
  </div>
  <div id="match-result"></div>`;
}

function matchClick(type,idx){
  const s=matchState;
  if(s.matched.includes(idx+"-word")&&type==="word")return;
  if(s.matched.includes(idx+"-def")&&type==="def")return;
  if(!s.selected){
    s.selected={type,idx};
    document.getElementById(type==="word"?`mw-${idx}`:`md-${idx}`).classList.add("selected");
  } else if(s.selected.type===type){
    document.getElementById(s.selected.type==="word"?`mw-${s.selected.idx}`:`md-${s.selected.idx}`).classList.remove("selected");
    s.selected={type,idx};
    document.getElementById(type==="word"?`mw-${idx}`:`md-${idx}`).classList.add("selected");
  } else {
    const wordIdx=type==="word"?idx:s.selected.idx;
    const defIdx=type==="def"?idx:s.selected.idx;
    const defText=s.shuffledDefs[defIdx];
    const correctDef=s.defs[wordIdx];
    const wid=`mw-${wordIdx}`,did=`md-${defIdx}`;
    document.getElementById(wid).classList.remove("selected");
    document.getElementById(did).classList.remove("selected");
    if(defText===correctDef){
      document.getElementById(wid).classList.add("matched");
      document.getElementById(did).classList.add("matched");
      s.matched.push(wordIdx+"-word",defIdx+"-def");
      if(s.matched.length===s.words.length*2){
        document.getElementById("match-result").innerHTML=`<p style="color:var(--green);font-size:14px;margin-top:1rem">✓ All matched! Great job.</p><button class="btn primary" style="margin-top:.75rem" onclick="switchModeByName('fill')">next: fill in blank →</button>`;
      }
    } else {
      const wEl=document.getElementById(wid),dEl=document.getElementById(did);
      wEl.classList.add("wrong-flash");dEl.classList.add("wrong-flash");
      setTimeout(()=>{wEl.classList.remove("wrong-flash");dEl.classList.remove("wrong-flash");},500);
    }
    s.selected=null;
  }
}

function renderFill(u,c,el){
  fillState={blanks:u.blanks,idx:0,score:0,selected:null};
  renderFillQ(el,c);
}
function renderFillQ(el,c){
  if(!el)el=document.getElementById("mode-content");
  if(!c)c=LEVELS[ALL_UNITS[currentUnit].level].color;
  const s=fillState;
  const q=s.blanks[s.idx];
  const opts=generateOpts(q.a,ALL_UNITS[currentUnit].words.map(x=>x.w));
  const dots=s.blanks.map((_,i)=>`<div class="q-dot${i<s.idx?" done":""}"></div>`).join("");
  el.innerHTML=`<div class="q-progress">${dots}</div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;letter-spacing:.4px;text-transform:uppercase">Question ${s.idx+1} of ${s.blanks.length}</div>
  <div class="q-sentence">${q.s.replace("_____","<span style='border-bottom:1px solid var(--text3);display:inline-block;min-width:90px'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>")}</div>
  <div class="q-options">${opts.map(o=>`<button class="q-opt" onclick="fillAnswer('${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join("")}</div>`;
}
function fillAnswer(opt,btn){
  const s=fillState;
  if(s.selected)return;
  s.selected=opt;
  const correct=opt.toLowerCase()===s.blanks[s.idx].a.toLowerCase();
  if(correct){btn.classList.add("correct");s.score++;}
  else{btn.classList.add("wrong");document.querySelectorAll(".q-opt").forEach(b=>{if(b.textContent.toLowerCase()===s.blanks[s.idx].a.toLowerCase())b.classList.add("correct");});}
  setTimeout(()=>{
    s.idx++;s.selected=null;
    if(s.idx>=s.blanks.length){
      lastMode="fill";
      if(s.score===s.blanks.length)mastered[currentUnit]=true;
      saveProgress();
      showResult(s.score,s.blanks.length);
    } else renderFillQ(null,null);
  },900);
}
function generateOpts(answer,allWords){
  const opts=[answer];
  const pool=[...allWords].filter(w=>w.toLowerCase()!==answer.toLowerCase());
  while(opts.length<4&&pool.length>0){const r=Math.floor(Math.random()*pool.length);opts.push(pool.splice(r,1)[0]);}
  return opts.sort(()=>Math.random()-.5);
}

function renderWrite(u,c,el){
  writeState={idx:0,words:u.words};
  renderWriteQ(el,c);
}
function renderWriteQ(el,c){
  if(!el)el=document.getElementById("mode-content");
  if(!c)c=LEVELS[ALL_UNITS[currentUnit].level].color;
  const s=writeState;
  const wd=s.words[s.idx];
  el.innerHTML=`<div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;letter-spacing:.4px;text-transform:uppercase">Word ${s.idx+1} of ${s.words.length}</div>
  <div class="def-card" style="margin-bottom:1rem">
    <span class="word-tag" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${wd.w}</span>
    <div class="meaning">${wd.d}</div>
    <div class="example">"${wd.e}"</div>
  </div>
  <p style="font-size:13px;color:var(--text2);margin-bottom:.5rem">Write your own sentence using <span style="color:${c.text};font-weight:500">"${wd.w}"</span>:</p>
  <textarea class="write-area" id="write-input" placeholder="Type your sentence here..."></textarea>
  <div style="display:flex;gap:8px">
    <button class="btn primary" onclick="checkWrite('${wd.w.replace(/'/g,"\\'")}')">check with AI ↗</button>
    <button class="btn" onclick="nextWrite()">${s.idx+1<s.words.length?"skip →":"finish →"}</button>
  </div>
  <div id="write-feedback"></div>`;
}
async function checkWrite(word){
  const sentence=document.getElementById("write-input").value.trim();
  if(!sentence){alert("Please write a sentence first.");return;}
  const fb=document.getElementById("write-feedback");
  fb.innerHTML=`<div class="ai-box"><div class="ai-label">AI teacher</div><div class="ai-text" style="color:var(--text3)">Checking your sentence...</div></div>`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      model:"claude-sonnet-4-20250514",max_tokens:1000,
      system:"You are a friendly English teacher helping Japanese learners. Check the sentence for natural English usage of the target word. Give brief feedback: 1) Is the target word used correctly? 2) Is the sentence natural? 3) One tip if needed. Keep it under 80 words. Be encouraging.",
      messages:[{role:"user",content:`Target word: "${word}"\nStudent's sentence: "${sentence}"\nPlease check this sentence.`}]
    })});
    const data=await res.json();
    fb.innerHTML=`<div class="ai-box"><div class="ai-label">AI teacher</div><div class="ai-text">${data.content?.[0]?.text||"Could not get feedback."}</div></div>`;
  }catch{fb.innerHTML=`<div class="ai-box"><div class="ai-text" style="color:var(--red)">Something went wrong. Please try again.</div></div>`;}
}
function nextWrite(){
  const s=writeState;s.idx++;
  if(s.idx>=s.words.length){studied[currentUnit]=true;saveProgress();renderMode("learn");}
  else renderWriteQ(null,null);
}

function showResult(score,total){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-result").classList.add("active");
  const pct=score/total;
  document.getElementById("result-emoji").textContent=pct===1?"🎉":pct>=.7?"👍":"📖";
  document.getElementById("result-score").textContent=`${score} / ${total}`;
  document.getElementById("result-msg").textContent=pct===1?"Perfect — unit mastered.":pct>=.7?"Good work. Keep going.":"Keep practicing — you'll get it.";
}
function backToUnit(){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-unit").classList.add("active");
}
function retryMode(){backToUnit();setTimeout(()=>switchModeByName(lastMode),50);}

loadProgress();renderHome();
</script>
</body>
</html>
